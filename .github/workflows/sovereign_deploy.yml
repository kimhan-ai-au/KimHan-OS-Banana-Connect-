yaml
name: Sovereign Global Deployment (KimHan_OS)

on:
  push:
    branches: [ main ]

jobs:
  kernel_takeover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 토큰 권한 부여

      - name: Execute Sovereign Push
        run: |
          chmod +x deploy_force.sh
          ./deploy_force.sh
