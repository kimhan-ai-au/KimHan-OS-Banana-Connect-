yaml
name: Sovereign Global Deployment (KimHan_OS)

on:
  push:
    branches: [ main ]

jobs:
  kernel_takeover:
    runs-on: ubuntu-latest
    permissions: # 권한 명시적 부여
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Git # 신원 인증
        run: |
          git config --global user.name "kimhan100ai"
          git config --global user.email "지휘관님의이메일"

      - name: Force Deployment
        run: |
          chmod +x deploy_force.sh # 실행 권한 부여
          ./deploy_force.sh
